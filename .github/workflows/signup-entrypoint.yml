name: Signup entrypoint quality
on:
  push:
    branches: [main, feature/signup-clean-baseline]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: php -l index.php
      - name: Shared layout contract
        run: |
          php -r '$s=file_get_contents("index.php"); if (!str_contains($s, "<!doctype html>") || !str_contains($s, "<main id=\"main-content\"></main>") || !str_contains($s, "/shared/header.php") || !str_contains($s, "/shared/footer.php") || preg_match("/\\b(mail|file_put_contents|mysqli_query|curl_exec)\\s*\\(/", $s)) exit(1);'
