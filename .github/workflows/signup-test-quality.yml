name: Signup test page quality
on:
  push:
    branches: [feature/generic-signup-test-page]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate PHP syntax
        run: php -l signup-test.php
      - name: Verify test-only behavior
        run: |
          php -r '$s=file_get_contents("signup-test.php"); if (!str_contains($s,"event.preventDefault()") || preg_match("/\\b(mail|file_put_contents|mysqli_query|curl_exec)\\s*\\(/", $s)) exit(1);'
