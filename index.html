<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ed">
  <meta name="description" content="Zoomie Boops. Fancy treats for fancy pets. Coming soon!">
  <title>Coming Soon | Zoomie Boops</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #fff7ed; color: #713f32; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
    header { padding: 28px 8%; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
    .status { font-size: 12px; letter-spacing: 2px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
    .content { max-width: 620px; }
    h1 { font-size: clamp(36px, 7vw, 60px); line-height: 1.12; margin: 0 0 20px; }
    .tagline { font-size: 22px; font-weight: 600; margin-bottom: 26px; }
    .description { color: #80685d; font-size: 17px; line-height: 1.8; margin-bottom: 36px; }
    .coming-soon { display: inline-block; background: #713f32; color: white; border-radius: 40px; padding: 15px 38px; font-weight: 600; letter-spacing: 1px; }
    footer { padding: 25px; text-align: center; color: #986f5c; font-size: 13px; }
  </style>
</head>
<body>
  <header><div class="brand">ZOOMIE BOOPS</div><div class="status">COMING SOON</div></header>
  <main><div class="content">
    <h1>Something pawsome<br>is baking!</h1>
    <p class="tagline">fancy treats for fancy pets.</p>
    <p class="description">We're getting ready to bring our homemade, thoughtfully crafted dog treats to your favorite four-legged friends.</p>
    <div class="coming-soon">Coming Soon</div>
  </div></main>
  <footer>Zoomies × boops = happiness<p>&copy; 2026 Zoomie Boops, LLC</p></footer>
</body>
</html>
